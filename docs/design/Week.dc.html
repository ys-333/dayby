<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400&display=swap">
  <style>
    body { margin: 0; }
    a { color: #8FB39A; text-decoration: none; }
    a:hover { color: #B4CDBB; }
    .rz { font-family: system-ui, "Roboto", "Helvetica Neue", sans-serif; -webkit-font-smoothing: antialiased; }
    .rz-ov { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #878073; }
    .rz-lg { font-size: 11px; color: #9E988B; display: flex; align-items: center; gap: 6px; }
  </style>
</helmet>

<div class="rz" style="width: 390px; height: 844px; background: #14120E; color: #F2EEE6; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden;">

  <div style="flex-grow: 1; display: flex; flex-direction: column; padding: 14px 16px 0 16px;">

    <div style="font-family: Newsreader, Georgia, serif; font-size: 26px; line-height: 34px; font-weight: 400; padding: 0 4px;">History</div>

    <div style="margin-top: 12px; height: 36px; background: #1B1915; border-radius: 999px; padding: 3px; box-sizing: border-box; display: flex; gap: 3px;">
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; border-radius: 999px; font-size: 13px; font-weight: 500; color: #9E988B; cursor: pointer;">Month</div>
      <div style="flex-grow: 1; display: flex; align-items: center; justify-content: center; border-radius: 999px; background: #42584A; font-size: 13px; font-weight: 600; color: #C6DECD;">Week</div>
    </div>

    <div style="margin-top: 8px; display: flex; align-items: center; justify-content: space-between; height: 40px;">
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; cursor: pointer;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 5.5L8 12l6.5 6.5" fill="none" stroke="#9E988B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
      <div style="font-size: 14px; font-weight: 500; color: #9E988B;">24 &ndash; 30 August</div>
      <div style="width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.5 5.5L16 12l-6.5 6.5" fill="none" stroke="#2C2924" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </div>
    </div>

    <div style="margin-top: 6px; padding: 12px 14px; background: #1B1915; border-radius: 10px; display: flex; align-items: center; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="font-size: 26px; line-height: 28px; font-weight: 600; letter-spacing: -0.02em;">52%</div>
        <div style="font-size: 11px; color: #878073;">so far</div>
      </div>
      <div style="width: 1px; height: 34px; background: #2C2924;"></div>
      <div style="font-size: 12px; line-height: 18px; color: #9E988B; text-wrap: pretty;">Two of six targets met. Today is still open.</div>
    </div>

    <div style="margin-top: 14px; display: flex; align-items: center; height: 22px;">
      <div style="width: 92px; flex-shrink: 0;"></div>
      <sc-for list="{{dayLetters}}" as="d" hint-placeholder-count="7">
        <div style="width: 38px; text-align: center; font-size: 11px; font-weight: 600; color: {{d.ink}}; letter-spacing: 0.04em;">{{d.letter}}</div>
      </sc-for>
    </div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{daily}}" as="row" hint-placeholder-count="5">
        <div style="height: 48px; display: flex; align-items: center; cursor: pointer;">
          <div style="width: 92px; flex-shrink: 0; display: flex; flex-direction: column; gap: 0px; padding-right: 8px; box-sizing: border-box;">
            <div style="font-size: 14px; line-height: 19px; font-weight: 500; color: #F2EEE6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{row.name}}</div>
            <div style="font-size: 11px; line-height: 15px; color: #878073; font-variant-numeric: tabular-nums;">{{row.tally}}</div>
          </div>
          <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="7">
            <div style="width: 38px; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="{{c.r}}" fill="{{c.fill}}" stroke="{{c.stroke}}" stroke-width="{{c.sw}}"></circle>
                <path d="{{c.d1}}" fill="{{c.f1}}"></path>
                <path d="{{c.d2}}" fill="none" stroke="{{c.gs}}" stroke-width="{{c.gw}}" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 10px; margin-bottom: 2px; display: flex; align-items: center; gap: 10px;">
      <div class="rz-ov">Weekly targets</div>
      <div style="flex-grow: 1; height: 1px; background: #26231E;"></div>
    </div>

    <div style="display: flex; flex-direction: column;">
      <sc-for list="{{targets}}" as="row" hint-placeholder-count="4">
        <div style="height: 48px; display: flex; align-items: center; cursor: pointer;">
          <div style="width: 92px; flex-shrink: 0; display: flex; flex-direction: column; padding-right: 8px; box-sizing: border-box;">
            <div style="font-size: 14px; line-height: 19px; font-weight: 500; color: #F2EEE6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">{{row.name}}</div>
            <div style="font-size: 11px; line-height: 15px; color: {{row.tallyInk}}; font-variant-numeric: tabular-nums;">{{row.tally}}</div>
          </div>
          <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="7">
            <div style="width: 38px; display: flex; align-items: center; justify-content: center;">
              <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="{{c.r}}" fill="{{c.fill}}" stroke="{{c.stroke}}" stroke-width="{{c.sw}}"></circle>
              </svg>
            </div>
          </sc-for>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: auto; margin-bottom: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px;">
      <div class="rz-lg"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="#8FB39A"></circle><path d="M7.4 12.4l3.1 3 6-6.2" fill="none" stroke="#14120E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>Done</div>
      <div class="rz-lg"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="none" stroke="#C0A46B" stroke-width="1.6"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="#C0A46B"></path></svg>Partial</div>
      <div class="rz-lg"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="none" stroke="#B58573" stroke-width="1.6"></circle><path d="M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8" fill="none" stroke="#B58573" stroke-width="1.7" stroke-linecap="round"></path></svg>Missed</div>
      <div class="rz-lg"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="none" stroke="#878073" stroke-width="1.6"></circle><path d="M8 12h8" fill="none" stroke="#878073" stroke-width="1.7" stroke-linecap="round"></path></svg>Skipped</div>
      <div class="rz-lg"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10.2" fill="none" stroke="#6B665C" stroke-width="1.6"></circle></svg>Not yet</div>
      <div class="rz-lg"><svg width="15" height="15" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5" fill="#8FB39A"></circle></svg>Counted toward a target</div>
    </div>

  </div>

  <div style="height: 76px; flex-shrink: 0; border-top: 1px solid #26231E; display: flex; align-items: flex-start; padding-top: 10px; background: #14120E;">
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.6" fill="none" stroke="#878073" stroke-width="1.5"></circle><path d="M8.4 12.2l2.5 2.4 4.7-5.2" fill="none" stroke="#878073" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="font-size: 11px; color: #878073;">Today</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.5h15v13h-15zM4.5 10.5h15M8.5 4v4M15.5 4v4" fill="none" stroke="#F2EEE6" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      <div style="font-size: 11px; font-weight: 500; color: #F2EEE6;">History</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 15.5l4.5-5 3.5 3 7-8.5" fill="none" stroke="#878073" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path><path d="M4 19.5h16" fill="none" stroke="#878073" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <div style="font-size: 11px; color: #878073;">Insights</div>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; gap: 5px;">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="#878073" stroke-width="1.5"></circle><path d="M12 3.5v2.2M12 18.3v2.2M20.5 12h-2.2M5.7 12H3.5M18 6l-1.6 1.6M7.6 16.4L6 18M18 18l-1.6-1.6M7.6 7.6L6 6" fill="none" stroke="#878073" stroke-width="1.5" stroke-linecap="round"></path></svg>
      <div style="font-size: 11px; color: #878073;">Settings</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
var CHECK = 'M7.4 12.4l3.1 3 6-6.2';
var CROSS = 'M8.6 8.6l6.8 6.8M15.4 8.6l-6.8 6.8';
var DASH  = 'M8 12h8';
var HALF  = 'M12 3a9 9 0 0 1 0 18z';

function cell(kind) {
  var base = { r: 10.2, fill: 'none', stroke: 'none', sw: 0, d1: '', f1: 'none', d2: '', gs: 'none', gw: 0 };
  if (kind === 'done')    return Object.assign(base, { r: 11, fill: '#8FB39A', d2: CHECK, gs: '#14120E', gw: 2.2 });
  if (kind === 'partial') return Object.assign(base, { stroke: '#C0A46B', sw: 1.6, d1: HALF, f1: '#C0A46B' });
  if (kind === 'missed')  return Object.assign(base, { stroke: '#B58573', sw: 1.6, d2: CROSS, gs: '#B58573', gw: 1.7 });
  if (kind === 'skipped') return Object.assign(base, { stroke: '#878073', sw: 1.6, d2: DASH, gs: '#878073', gw: 1.7 });
  if (kind === 'pending') return Object.assign(base, { stroke: '#6B665C', sw: 1.6 });
  if (kind === 'future')  return Object.assign(base, { r: 10.2, stroke: '#38342C', sw: 1.6 });
  if (kind === 'nosched') return Object.assign(base, { r: 1.8, fill: '#524C42' });
  if (kind === 'hit')     return Object.assign(base, { r: 4.5, fill: '#8FB39A' });
  return Object.assign(base, { r: 1.8, fill: '#38342C' });
}

class Component extends DCLogic {
  renderVals() {
    var dayLetters = [
      { letter: 'M', ink: '#878073' }, { letter: 'T', ink: '#878073' },
      { letter: 'W', ink: '#878073' }, { letter: 'T', ink: '#878073' },
      { letter: 'F', ink: '#878073' }, { letter: 'S', ink: '#C6DECD' },
      { letter: 'S', ink: '#6B665C' }
    ];

    var dailyRaw = [
      { name: 'Running',        tally: '2 of 6', days: ['missed','missed','skipped','partial','done','done','future'] },
      { name: 'Meditate',       tally: '2 of 6', days: ['missed','missed','missed','missed','done','done','future'] },
      { name: 'Reading',        tally: '0 of 5', days: ['missed','missed','missed','missed','missed','pending','future'] },
      { name: 'Finmonk',        tally: '3 of 6', days: ['done','missed','missed','partial','done','done','future'] },
      { name: 'Work on Otto 2', tally: '2 of 5', days: ['missed','done','missed','missed','done','pending','future'] }
    ];

    var targetRaw = [
      { name: 'Gym',           tally: '2 of 3', met: false, days: [0,1,0,0,1,0,0] },
      { name: 'Swim',          tally: '1 of 2', met: false, days: [0,0,1,0,0,0,0] },
      { name: 'Learning',      tally: '2 of 3', met: false, days: [1,0,0,1,0,0,0] },
      { name: 'Long walk',     tally: '3 of 3', met: true,  days: [1,0,1,0,1,0,0] }
    ];

    return {
      dayLetters: dayLetters,
      daily: dailyRaw.map(function (r) {
        return {
          name: r.name,
          tally: r.tally,
          cells: r.days.map(function (k) { return cell(k); })
        };
      }),
      targets: targetRaw.map(function (r) {
        return {
          name: r.name,
          tally: r.tally,
          tallyInk: r.met ? '#8FB39A' : '#878073',
          cells: r.days.map(function (d) { return cell(d ? 'hit' : 'idle'); })
        };
      })
    };
  }
}
</script>
</body>
</html>
